<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RentManor</title>
  <link rel="canonical" href="site/">
  <script>
    // GitHub Pages fallback: marketing lives in site/, the PWA in app/.
    // Also drop the old root service worker (rental-home-shell-v2) so visitors
    // are not stuck on a cached config wall from the previous root PWA.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) {
          var script = (reg.active && reg.active.scriptURL) ||
            (reg.waiting && reg.waiting.scriptURL) ||
            (reg.installing && reg.installing.scriptURL) || '';
          if (/\/sw\.js$/.test(script) && script.indexOf('/app/') === -1) {
            reg.unregister();
          }
        });
      });
    }
    var next = 'site/' + location.search + location.hash;
    location.replace(next);
  </script>
  <meta http-equiv="refresh" content="0; url=site/">
</head>
<body>
  <p><a href="site/">Continue to RentManor</a> · <a href="app/">Open the app</a></p>
</body>
</html>
