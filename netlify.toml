# One Netlify site, publish the repo root.
# Host rules:
#   rentmanor.com (+ www → apex) → site/
#   app.rentmanor.com             → app/
#
# Powered-by badge: Netlify injects `/.netlify/scripts/hud?variant=public` after
# </html> (creates #nl-badge-frame / #nl-hud-frame). [[headers]] cannot strip it.
# Official off-switch is Netlify UI → Project configuration → General →
# Powered by Netlify badge. App dismisses the HUD via localStorage + CSS hide
# + 64px sheet padding so Account → Sign out stays tappable on a phone.
#
# Netlify Pretty URLs / canonical rewriting may turn relative site links into
# absolute /site/... paths. Those must NOT go through the catch-all
# rentmanor.com/* → /site/:splat (that would become /site/site/...).
# More-specific /site/* and /app/* rules come first.

[build]
  publish = "."
  command = ""

# www → apex
[[redirects]]
  from = "https://www.rentmanor.com/*"
  to = "https://rentmanor.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.rentmanor.com/"
  to = "https://rentmanor.com/"
  status = 301
  force = true

# App host → PWA folder
[[redirects]]
  from = "https://app.rentmanor.com/*"
  to = "/app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://app.rentmanor.com/"
  to = "/app/"
  status = 200
  force = true

# Apex: already-/site/ paths (Pretty URL absolute links) — do not double-prefix
[[redirects]]
  from = "https://rentmanor.com/site/*"
  to = "/site/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://rentmanor.com/site"
  to = "/site/"
  status = 200
  force = true

# Apex: already-/app/ paths if someone hits them on the marketing host
[[redirects]]
  from = "https://rentmanor.com/app/*"
  to = "/app/:splat"
  status = 200
  force = true

# Apex → marketing folder for bare paths (/features.html, /)
[[redirects]]
  from = "https://rentmanor.com/*"
  to = "/site/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://rentmanor.com/"
  to = "/site/"
  status = 200
  force = true

[[headers]]
  for = "/app/config.js"
  [headers.values]
    Cache-Control = "no-store"
